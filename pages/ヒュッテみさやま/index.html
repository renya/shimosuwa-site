    <p class="description">
      <a href="/pages/八島湿原/">八島湿原</a>周遊コース、<a href="/pages/旧御射山社/">旧御射山社</a>の近くにある山小屋。<br>
      宿泊は4月末〜10月末は毎日、冬季は週末のみ予約可。<br>
      喫茶店の営業時間は10:00〜15:00。夏季は毎日営業、冬季は金土日のみ営業。<br>
      駐車場はないので、八島湿原駐車場から30分程歩いて訪ねる。<br>
      現在はKiNOA合同会社が運営。
    </p>
