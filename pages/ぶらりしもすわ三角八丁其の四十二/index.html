    <h1>ぶらりしもすわ三角八丁其の四十二</h1>

   <div class="tags">
     <a class="tag" href="/pages/出来事/">出来事</a>
   </div>

<p class="description">
    ぶらりしもすわ三角八丁は平成16年(2004)の秋から続く<a href="/pages/秋宮/">秋宮</a>と<a href="/pages/春宮/">春宮</a>と<a href="/pages/大灯篭/">大灯篭</a>を結んだ三角形のエリアを中心とした街歩きイベント。
    其の四十二は2026年11月3日の午前10時から午後3時30分に開催です。
    例年は春と秋の年2回開催ですが、2026年は秋のみの開催となっています。
</p>

<p>
    八丁の丁とは昔の距離の単位で1丁は約109m。8丁で約873mは<a href="/pages/大灯篭/">大灯篭</a>から<a href="/pages/秋宮/">秋宮</a>と<a href="/pages/春宮/">春宮</a>までそれぞれのおよその距離です。
</p>
