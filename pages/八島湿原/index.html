    <h1>八島湿原</h1>

 <div class="tags">
   <a class="tag" href="/pages/スポット/">スポット</a>
 </div>

    <p class="description">
      八島湿原は七島八島(ななしまやしま)とも呼ばれる標高1630mにある高層湿原。<br>
      昭和14年(1939)に国の天然記念物指定される。<br>
      一周約3.7km。<a href="/pages/ヒュッテみさやま/">ヒュッテみさやま</a>がある<a href="/pages/旧御射山遺跡/">旧御射山遺跡</a>から鎌ヶ池の間は砂利道、そこ以外は木道の散歩道。
    </p>
