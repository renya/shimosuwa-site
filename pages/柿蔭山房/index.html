    <h1>柿蔭山房</h1>

    <div class="tags">
      <a class="tag" href="/pages/スポット/">スポット</a>

    <p class="description">
        柿蔭山房(しいんさんぼう)はアララギ派の歌人・島木赤彦が晩年を過ごした旧宅で、江戸時代後期の茅葺きの母屋を残す下諏訪町指定文化財です。
    </p>

<div class="meta">
  <div><span>住所:</span> 下諏訪町北高木9180</div>
  <div><span>地図:</span> <a href="https://i.suwa.info/view/shimosuwa.html?lat=36.065493139830195&lng=138.10700785936444&zoom=16&name=柿蔭山房" class="map-link" target="_blank">開く</a></div>
</div>

<p>
    昭和54年(1979)に久保田家より下諏訪町に寄贈されています。
</p>
