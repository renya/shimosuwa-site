    <p class="description">
      1996年3月20日にオープンした「諏訪湖 オルゴール博物館 奏鳴館」が2016年3月に「日本電産サンキョー オルゴール記念館 すわのね」にリニューアルしたオルゴール博物館。
      オルゴールの組立体験をする事も出来ます。
    </p>
