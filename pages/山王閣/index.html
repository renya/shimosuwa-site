    <h1>山王閣</h1>

 <div class="tags">
   <a class="tag" href="/pages/スポット/">スポット</a>
 </div>

    <p class="description">
      ホテル山王閣は2017年3月31日に閉館した、かつて<a href="/pages/秋宮/">秋宮</a>脇の山王台にあった宿泊施設。1965年12月に国民宿舎として開業し、55室を備える町内最大規模の宿泊施設だった。1987年に県企業局から払下げを受け、第三セクター下諏訪観光事業が運営していた。諏訪大社との50年間の土地賃借契約満了を見据え、下諏訪観光事業は2005年9月20日で営業を終了。その後は元従業員らが設立した会社が運営を引き継ぎ、契約満了まで営業を続けた。2017年の閉館後、建物は解体され、現在は更地・駐車場となっている。
    </p>
