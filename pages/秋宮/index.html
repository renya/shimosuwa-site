    <h1>秋宮</h1>

 <div class="tags">
   <a class="tag" href="/pages/スポット/">スポット</a>
 </div>

<div class="meta">
  <div><span>住所:</span> 下諏訪町上久保35806</div>
  <div><span>地図:</span> <a href="https://www.google.com/maps?q=36.07490858768352,138.09031819375076" class="map-link" target="_blank">Google Mapsで見る</a></div>
</div>

    <p class="description">
      <a href="/pages/諏訪大社/">諏訪大社</a>下社秋宮はJR下諏訪駅から八幡坂を上り徒歩20分。中山道下諏訪宿の近くにあることから、昔も今も多くの参拝客が訪れます。一位の木を御神木としています。
    </p>

    <div class="gallery">
      <img src="https://i.suwa.info/p/taisha/akimiya-front-snow.jpg" alt="雪の秋宮前">
    </div>

    <div class="gallery">
<figure>
  <img src="https://i.suwa.info/p/taisha/akimiya-kaguraden.jpg" alt="秋宮の風景">
  <figcaption>
        鳥居をくぐって階段を上ってすぐ見える大きな建物は昭和58年12月26日に国の重要文化財に指定されている神楽殿(かぐらでん)です。天保6(1835)年、幕府から内匠(たくみ)の称号を許された立川流の二代目立川和四郎富昌の54歳の時の作です。<br>
        その名の通りお神楽を奉納する際に使用される他、結婚式から厄払いまで様々な祭事がこの建物で行われます。
    <small>ある書籍に載っている写真</small>
  </figcaption>
</figure>

<figure>
  <img src="https://i.suwa.info/p/taisha/akimiya-heihaiden.jpg" alt="弊拝殿">
  <figcaption>
        神楽殿の奥にあるのが弊拝殿(へいはいでん)です。この建物も神楽殿と同じく昭和58年12月26日に国の重要文化財に指定されています。安永6(1777)年に起工され安永10年に落成しました。工匠は諏訪出身で立川流建築の初代立川和四郎富棟です。拝殿内部の竹に鶴などは代表作となっている彫刻は中沢五平衛を師匠としていました。
    <small></small>
  </figcaption>
</figure>

<figure>
  <img src="https://i.suwa.info/p/taisha/sannoukaku.jpg" alt="山王閣">
  <figcaption>
    今は駐車場になっているかつての宿泊施設、山王閣。2017年3月31日に閉館。昭和40年12月から50年諏訪大社の土地を借りて営業されていた。
    <small>2002年6月9日</small>
  </figcaption>
</figure>
