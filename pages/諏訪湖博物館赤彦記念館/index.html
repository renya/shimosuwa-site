    <p class="description">
      下諏訪町立の博物館で、諏訪湖の自然や歴史、湖とともに暮らしてきた人々の文化を紹介するとともに、歌人・島木赤彦の生涯と作品を展示しています。
    </p>

    <p>
      1971年4月1日に高浜の湖岸に開館した町立博物館を移転・新設した施設です。
      建物は伊東豊雄が設計し、竣工が平成5年(1993)3月、平成5年6月15日に開館しています。
    </p>
