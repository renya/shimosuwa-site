    </p>

19年5月9日に下社の仮見立てが下諏訪町の東俣国有林で行われた。2時間ほどで8本のモミの候補木を選定。秋宮一之御柱の目通り周囲は362cmで前回より27cm太く、春宮一之御柱は333cmで前回より8cm太い。
