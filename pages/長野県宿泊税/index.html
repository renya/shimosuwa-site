      2026年6月1日より、長野県は法定外目的税として宿泊税を導入。<br>
      長野県宿泊税条例(令和7年3月21日 長野県条例第23号)による。<br>
      税額は1泊定額300円。ただし制度開始から3年間は200円。<br>
      6000円以上の宿泊に対し定額課税。<br>
      宿泊施設が宿泊者から徴収し、毎月県に申告納入する。
