    <h1>殿村遺跡</h1>

    <div class="tags">
      <a class="tag" href="/pages/スポット/">スポット</a>
    </div>

    <p class="description">
        殿村遺跡は、縄文時代から中世にかけての遺構や遺物が見つかっている高木地区の遺跡です。竪穴住居が復元されています。
    </p>

<div class="meta">
  <div><span>住所:</span> 下諏訪町</div>
  <div><span>地図:</span> <a href="https://i.suwa.info/view/shimosuwa.html?lat=36.06700553430322&lng=138.10606095835126&zoom=16&name=殿村遺跡" class="map-link" target="_blank">開く</a></div>
</div>

<p>
    現在の復元住居は平成25年(2013)に作られた2代目。
    周辺一帯が遺跡であり、この区画だけではありません。過去4回にわたり発掘調査が行われました。
    復元住居は自由に中に入ることが出来ます。
</p>
