    <p class="description">
臨済宗妙心寺派の寺院。
山号は白華山。
本尊は十一面千手千眼観音菩薩。
寺紋は武田菱。
正安2年(1300)創建。創建時は建長寺派。
伊那・諏訪八十八ヶ所霊場十八番札所。諏訪郡霊場百番札所の西二十一番札所。
    </p>
