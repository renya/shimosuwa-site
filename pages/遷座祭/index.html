    <h1>遷座祭</h1>

   <div class="tags">
     <a class="tag" href="/pages/文化/">文化</a>
   </div>

    <p class="description">
        <a href="/pages/諏訪大社/">諏訪大社</a>下社の遷座祭とは御霊代(みたましろ)を2月1日から8月1日までは<a href="/pages/春宮/">春宮</a>に、8月1日から2月1日までは<a href="/pages/秋宮/">秋宮</a>に還す特殊神事。2月1日は<a href="/pages/春の遷座祭/">春の遷座祭</a>、8月1日は<a href="/pages/お舟祭り/">お舟祭り</a>で。
    </p>

    <p>
        遷座は一般的な神社では社殿の建替えや修理の際に一時的に神様を仮の社殿に遷す事を言い、
        また、20年毎や60年毎の式年遷宮を行う神社もありますが、
        1年の中で定期的に遷座するのはかなり特殊で他に例はほとんどありません。<br>
        更に諏訪大社の本宮、秋宮、春宮の3社にはそれぞれ御宝殿が東西2つあり<a href="/pages/御柱祭/">御柱祭</a>毎に交互に新築され、御霊代が遷されます。これは式年造営と言われています。
    </p>
