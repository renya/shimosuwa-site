    <h1>遷座祭</h1>

   <div class="tags">

    <p class="description">
        <a href="/pages/諏訪大社/">諏訪大社</a>下社の御霊代(みたましろ)を2月1日から8月1日までは春宮に、8月1日から2月1日までは秋宮に還す特殊神事。2月1日は<a href="/pages/春の遷座祭/">春の遷座祭</a>、8月1日は<a href="/pages/お舟祭り/">お舟祭り</a>で。
    </p>

    <p>
        遷座は一般的な神社では社殿の建替えや修理の際に一時的に神様を仮の社殿に遷す事を言い、
        また、20年毎や60年毎の式年遷宮を行う神社もありますが、
        1年の中で定期的に遷座するのはかなり特殊で他に例はほとんどありません。<br>
        更に諏訪大社の内前宮を除く3社には御宝殿が東西2つあり<a href="/pages/御柱祭/">御柱祭</a>毎に交互に新築され、御霊代が遷られます。これも式年造営と言われています。
    </p>
