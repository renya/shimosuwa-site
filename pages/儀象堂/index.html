    <p class="description">
        前身の「諏訪湖 時の科学館 儀象堂」は平成9年(1997)3月18日に開館しました。
        中国・北宋時代の天文時計「水運儀象台」の復元展示を中心に、時計の仕組みや歴史を紹介しています。
        時計づくり体験もできます。
        平成30年(2018)4月14日にリニューアルし、「<a href="/pages/矢の根や/">星ヶ塔ミュージアム </a>」と共に「<a href="/pages/しもすわ今昔館おいでや/">しもすわ今昔館おいでや</a>」を構成しています。
    </p>
