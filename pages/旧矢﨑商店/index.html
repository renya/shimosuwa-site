    <p class="description">
        旧矢﨑商店は、製糸業で栄えた下諏訪の歴史を伝える、昭和11年(1936)築の生糸問屋の商家で、2022年度に町が取得して保存・活用を進めている建物です。
    </p>

<div class="meta">
