    <h1>和田峠と歴史の道</h1>

    <div class="tags">

    </div>

    <p class="description">
        「和田峠と歴史の道」は日本遺産「<a href="https://suwa.info/pages/星降る中部高地の縄文世界/">星降る中部高地の縄文世界</a>」の構成文化財です。
        和田峠は黒曜石の原産地であり、旧石器時代から黒曜石が利用されてきました。また、中山道の難所として、江戸時代にも多くの人々が往来しました。
    </p>

    <p>
        中山道は江戸から京都までの街道ですが、そのうちの一部が国史跡に指定されていて、長和町内にもその区間があります。
    </p>
