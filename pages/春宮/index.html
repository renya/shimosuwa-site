    <h1>春宮</h1>

 <div class="tags">

<div class="meta">
  <div><span>住所:</span> 下諏訪町大門193-1</div>
  <div><span>地図:</span> <a href="https://i.suwa.info/view/shimosuwa.html?lat=36.081362026995286&lng=138.08201063874844&zoom=16&name=春宮" class="map-link" target="_blank">開く</a></div>

    <p class="description">
      <a href="/pages/諏訪大社/">諏訪大社</a>下社春宮は下社最初の鎮座地と言われています。下諏訪駅から春宮大門と呼ばれる大鳥居を経由して徒歩25分。建築物は<a href="/pages/秋宮/">秋宮</a>の立川流に対して大隈流の柴宮長左エ門が建立。杉の木を御神木としています。
    </p>

    <div class="gallery">
      <a href="https://i.suwa.info/p/taisha/harumiya-torii.jpg" target="_blank">
  <img src="https://i.suwa.info/p/taisha/harumiya-torii.jpg" alt="春宮の前">
</a>
    </div>

<div class="gallery">
<figure>
  <a href="https://i.suwa.info/p/taisha/harumiya-kaguraden.jpg" target="_blank">
  <img src="https://i.suwa.info/p/taisha/harumiya-kaguraden.jpg" alt="神楽殿">
</a>
  <figcaption>
    神楽殿は文字通りご神前でお神楽を奉納するための建物です。落成は天和年間(1680年代)頃と言われています。
    <small></small>
  </figcaption>
</figure>

<figure>
  <a href="https://i.suwa.info/p/taisha/harumiya-kaguraden-contest.png" target="_blank">
  <img src="https://i.suwa.info/p/taisha/harumiya-kaguraden-contest.png" alt="神楽殿">
</a>
  <figcaption>
    神楽殿では以前初夏には<a href="/pages/お舟祭り/">お舟祭り</a>の際の時代行列の華である万寿姫(まんじゅひめ)コンテストが行われていました。
    <small>2002年6月29日撮影</small>
  </figcaption>
</figure>

<figure>
  <a href="https://i.suwa.info/p/taisha/harumiya-heihaiden.jpg" target="_blank">
  <img src="https://i.suwa.info/p/taisha/harumiya-heihaiden.jpg" alt="弊拝殿">
</a>
  <figcaption>
    弊拝殿(へいはいでん)は国の重要文化財に指定されています。御幣を奉ずる幣殿と拝殿が一体となった造りのため、こう呼ばれています。建築様式は二重楼門造りです。落成は安永9(1780)年と秋宮より1年早くなっています。
    棟梁は大隈流の柴宮長左エ門が務めました。絵図面は秋宮と同じ物で社殿の構造も基本的には同じ物となっています。
    <small></small>
  </figcaption>
</figure>

<figure>
  <a href="https://i.suwa.info/p/taisha/tsutsugayuden.jpg" target="_blank">
  <img src="https://i.suwa.info/p/taisha/tsutsugayuden.jpg" alt="筒粥殿">
</a>
  <figcaption>
    毎年1月14日夜から15日早朝にかけて行われる筒粥神事の神粥炊上げが行われる建物。
    <small></small>
  </figcaption>
</figure>
