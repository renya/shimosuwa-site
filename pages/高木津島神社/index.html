    <h1>津島神社</h1>

    <div class="tags">
      <a class="tag" href="/pages/スポット/">スポット</a>
    </div>

    <p class="description">
        高木津島神社は、尾張津島神社の分社で、旧高木村の鎮守として祀られてきた神社です。境内には江戸時代<!-- の元禄7年(1697)又は宝暦2年(1752)又は宝暦4年(1754) -->に建てられた町指定文化財の本殿や、島木赤彦らの歌碑があります。
    </p>

<div class="meta">
  <div><span>住所:</span> 下諏訪町東高木9305</div>
  <div><span>地図:</span> <a href="https://i.suwa.info/view/shimosuwa.html?lat=36.06598465665563&lng=138.1081212093533&zoom=16&name=津島神社" class="map-link" target="_blank">開く</a></div>
  <div><span>備考:</span> 下諏訪町文化財(平成30年12月19日指定)</div>
</div>

<p>
    明治5年に村社に昇格。
</p>
